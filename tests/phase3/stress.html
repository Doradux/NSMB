<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Phase 3: linked Wasm 128-frame-cycle stability</title>
<style>body{font:16px system-ui;background:#101d2a;color:#ebf3fd;margin:3rem auto;padding:0 1rem;max-width:48rem}
pre{background:#20364b;padding:1rem;overflow-wrap:anywhere;white-space:pre-wrap}#result{padding:.75rem;background:#42566b}
#result[data-state=pass]{background:#275744}#result[data-state=fail]{background:#752e38}</style></head>
<body><main><h1>W03 + W07 one-Wasm 128-cycle browser stress</h1>
<p>Compiled synthetic C++ Wasm only; no Wii game code or assets.</p>
<p id="result" data-state="pending" role="status">Running linked Wasm over browser animation frames…</p>
<pre id="details"></pre></main>
<script type="module">
import factory from '/runtime/frame_loop.mjs';
import { createFrameHost } from '/runtime/host.mjs';
const output=document.querySelector('#result');
const details=document.querySelector('#details');
function check(ok,message){if(!ok)throw Error(message);}
try {
 const module=await factory({locateFile:()=>'/runtime/frame_loop.wasm'});
 const c=(name,...args)=>{
   const fn=module['_nsmbw_'+name];
   if(typeof fn!=='function')throw Error('missing linked Wasm export '+name);
   return fn(...args);
 };
 const iterations=128;let checkedFrames=0;
 const started=performance.now();
 for(let cycle=0;cycle<iterations;cycle++) {
   c('loop_reset');
   check(c('mem_pages')===0,'reset memory pages at cycle '+cycle);
   check(c('loop_trace_length')===0,'reset trace at cycle '+cycle);
   check(c('mem_set_page_budget',3)===1,'set synthetic sparse budget');
   for(const [id,source,initial,dest,delta,limit] of [
      [1,0x80001000,10+cycle,0x80001020,1,3],
      [2,0x80002000,20+cycle,0x80002020,2,3],
      [3,0x80003000,30+cycle,0xCC008000,3,1]
   ]) {
     check(c('mem_write32',source,initial)===1,'source write '+id);
     check(c('loop_spawn',id,source,dest,delta,limit)===1,'spawn '+id);
   }
   const host=createFrameHost(module,{ids:[1,2,3],budget:2,maxFrames:8,
     onFrame:info=>{checkedFrames++;check(info.executed<=2,'frame budget exceeded');}});
   const result=await host.start(); // uses REAL browser requestAnimationFrame
   check(result.reason==='blocked','expected surviving blocked MMIO fault');
   check(result.frames===4,'expected four callbacks, cycle '+cycle);
   check(result.done===2 && result.faulted===1,'guest fault isolation');
   check(result.contexts[0].pc===3&&result.contexts[1].pc===3&&result.contexts[2].pc===0,
         'guest PC isolation');
   check(result.contexts[0].regA===13+cycle&&result.contexts[1].regA===26+cycle,
         'guest registers');
   check(result.contexts[2].guestError===4,'typed MMIO rejection');
   check(c('mem_pages')===3,'sparse budget never grew unexpectedly');
   const traces=Array.from({length:c('loop_trace_length')},(_,n)=>c('loop_trace_at',n)>>>16);
   check(JSON.stringify(traces)===JSON.stringify([1,2,3,1,2,1,2]),'deterministic trace');
   host.dispose();
 }
 c('loop_reset');
 check(c('mem_pages')===0,'final memory reclaimed after all browser frames');
 check(c('loop_trace_length')===0,'final trace reset');
 const data={
   status:'pass',moduleType:'actual linked Emscripten C++ WASM',
   iterations,animationFrames:checkedFrames,guestOperations:iterations*7,
   isolatedGuestFaults:iterations,finalPages:c('mem_pages'),
   elapsedMs:Math.round((performance.now()-started)*100)/100,
   caveat:'No authentic Wii code/graphics/OS fibers; deterministic synthetic stress only'
 };
 window.__nsmbPhase3Stress=data;
 details.textContent=JSON.stringify(data,null,2);
 output.dataset.state='pass';
 output.textContent='PASS — 128 linked Wasm sessions over '+checkedFrames+' real animation frames';
}catch(err) {
 const data={status:'fail',error:String(err?.stack||err)};
 window.__nsmbPhase3Stress=data;
 details.textContent=JSON.stringify(data,null,2);
 output.dataset.state='fail';
 output.textContent='FAIL — linked Wasm browser stress';
}
</script></body></html>
