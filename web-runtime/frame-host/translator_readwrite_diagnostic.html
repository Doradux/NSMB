<title>Actual public PPC STW/LWZ/STW transaction guest ABI</title></head>
<body><h1>Generated synthetic PowerPC coherent journal (test only)</h1>
<p>Public authored code; no Nintendo game files or real game execution.</p>
<pre id="status">Running actual translated C++ in WebAssembly…</pre>
<script type="module">
import factory from './dist/frame_loop_translated_readwrite_fixture.mjs';
import {createFrameHost} from './host.mjs';
const view=document.querySelector('#status');
const chk=(yes,why)=>{if(!yes)throw Error(why)};
try{
 const wasm=await factory({locateFile:()=>new URL('./dist/frame_loop_translated_readwrite_fixture.wasm',import.meta.url).href});
 const c=(name,...args)=>{const f=wasm['_nsmbw_'+name];chk(typeof f==='function','wasm export '+name);return f(...args)};
 const spawn=(id,a,b,v)=>c('loop_translated_store_spawn',id,0x80005010+id*0x1000,a,b,v,0x81002000+id,0x81003000+id);
 let frames=0,blockedCount=0;
 c('loop_reset');
 const vals=[0x01020304,0xFFFFFFFF,0];
 for(let id=1;id<=3;id++){
   const a=0x80010000+id*0x2000;
   chk(spawn(id,id===2?(a|0x40000000):a,a+0x1000,vals[id-1])===1,'guest context spawn');
 }
 const host=createFrameHost(wasm,{ids:[1,2,3],budget:2,maxFrames:4,onFrame:()=>frames++});
 const completed=await host.start();
 chk(completed.reason==='completed'&&completed.frames===2&&completed.done===3,'real RAF multi guest');
 for(let id=1;id<=3;id++){
   const a=0x80010000+id*0x2000;
   chk((c('loop_cpu_gpr',id,5)>>>0)===vals[id-1],'r5 gets staged read');
   chk((c('mem_read32',a)>>>0)===vals[id-1],'committed source word');
   chk((c('mem_read32',a+0x1000)>>>0)===vals[id-1],'committed second destination');
 }
 host.dispose();
 // Negative checked MMIO second destination, W07 device callback MUST remain absent.
 c('loop_reset');
 chk(c('mem_write32',0x80010000,0xDEADBEEF)===1,'preexisting RAM');
 chk(spawn(1,0x80010000,0xCC008000,0x01020304)===1,'MMIO case spawn');
 const badHost=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>frames++});
 const bad=await badHost.start();
 chk(bad.reason==='blocked'&&bad.faulted===1,'guest MMIO error');
 chk(c('loop_guest_error',1)===7&&c('interop_device_invoked')===0,'typed denial without callback');
 chk(c('loop_cpu_gpr',1,5)===0&&(c('loop_pc',1)>>>0)===0x80001000,'failed forwarded value not committed');
 chk((c('mem_read32',0x80010000)>>>0)===0xDEADBEEF,'original RAM unchanged');
 badHost.dispose();blockedCount++;
 // Late page-quota rejection with first original word preexisting.
 c('loop_reset');
 chk(c('mem_write32',0x80010000,0xCAFE1234)===1,'preexisting first page');
 chk(c('mem_set_page_budget',1)===1,'quota first allocated page only');
 chk(spawn(1,0x80010000,0x80011000,0x10203040)===1,'late fault scenario');
 const quotaHost=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>frames++});
 const quota=await quotaHost.start();
 chk(quota.reason==='blocked'&&quota.faulted===1&&c('loop_guest_error',1)===3,'late W04 quota');
 chk((c('mem_read32',0x80010000)>>>0)===0xCAFE1234&&c('mem_pages')===1,'old value and quota preserved');
 chk(c('loop_cpu_gpr',1,5)===0&&(c('loop_pc',1)>>>0)===0x80001000,'register and PC rollback');
 quotaHost.dispose();blockedCount++;
 for(let i=0;i<128;i++){
   c('loop_reset');
   chk(c('mem_set_page_budget',2)===1,'clear budget after reset');
   chk(spawn(1,0x80010000,0x80011000,i)===1,'restart');
   const frame=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>frames++});
   const done=await frame.start();
   chk(done.reason==='completed'&&done.frames===1,'real RAF translated journal');
   chk(c('loop_cpu_gpr',1,5)===i,'read your own staged value after reset');
   chk(c('mem_read32',0x80011000)===i,'second committed word');
   frame.dispose();
 }
 c('loop_reset');chk(c('mem_pages')===0,'RAM cleared after 128 loops');
 const result={status:'pass',actualWasm:true,contexts:3,callbacks:frames,blocked:blockedCount,
   stressCycles:128,zeroPageGhosts:true,guestReadForwarded:true,finalPages:c('mem_pages'),
   limitation:'Only public 4-op synthetic STW/LWZ/STW/BLR, not real Wii runtime'};
 window.__nsmbP7ReadForward=result;view.textContent=JSON.stringify(result,null,2);
}catch(err){const result={status:'fail',error:String(err?.stack||err)};
 window.__nsmbP7ReadForward=result;view.textContent=JSON.stringify(result,null,2);}
</script></body></html>
