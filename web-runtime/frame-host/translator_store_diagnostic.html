<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<title>Real public PowerPC translated transactional stores — test only</title></head>
<body><h1>Copyright-free stw + bl + blr — checked transactional guest RAM</h1>
<p>This is a test-only synthetic PowerPC diagnostic. It is NOT Nintendo game code.</p>
<pre id="status">Compiling guest side effects into a bounded real browser frame...</pre>
<script type="module">
import factory from './dist/frame_loop_translated_store_fixture.mjs';
import {createFrameHost} from './host.mjs';
const screen=document.querySelector('#status');
const expect=(condition,message)=>{if(!condition)throw Error(message);};
try{
 const wasm=await factory({locateFile:()=>new URL('./dist/frame_loop_translated_store_fixture.wasm',import.meta.url).href});
 const c=(name,...args)=>{
  const fn=wasm['_nsmbw_'+name];
  if(typeof fn!=='function')throw Error('Wasm export missing '+name);
  return fn(...args);
 };
 let callbacks=0,lateFaults=0,deviceDenials=0,cycles=0;
 const spawn=(id,a,b,payload)=>c('loop_translated_store_spawn',id,
  0x80005010+id*0x1000,a,b,payload,0x81002000+id,0x81003000+id);
 // THREE contexts dispatch from source-generated exact void(CpuContext*) C++.
 c('loop_reset');
 const values=[0x10203040,0xFFFFFFFF,0x55AA7700];
 for(let id=1;id<=3;id++){
  const a=0x80010000+id*0x2000;
  expect(spawn(id,id===2?(a|0x40000000):a,a+0x1000,values[id-1])===1,'translated store context '+id);
 }
 const host=createFrameHost(wasm,{ids:[1,2,3],budget:2,maxFrames:3,onFrame:()=>callbacks++});
 const finished=await host.start();
 expect(finished.reason==='completed'&&finished.frames===2&&finished.done===3,'three checked guests finish in 2 real RAF');
 host.dispose();
 for(let id=1;id<=3;id++){
  const a=0x80010000+id*0x2000,v=values[id-1]>>>0;
  expect((c('mem_read32',a)>>>0)===v && (c('mem_read32',a+0x1000)>>>0)===v,'physical alias guest STW words');
  expect((c('loop_cpu_gpr',id,3)>>>0)===((v+1)>>>0),'real translated bl leaf increment');
 }
 // Quota fails only AFTER the first physical W07 RAM word has been written.
 c('loop_reset');
 expect(c('mem_write32',0x80010000,0xDEADBEEF)===1,'preexisting word');
 expect(c('mem_set_page_budget',1)===1,'one physical RAM page');
 expect(spawn(1,0x80010000,0x80011000,0x12345678)===1,'quota case starts');
 const quota=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>callbacks++});
 const blocked=await quota.start();
 expect(blocked.reason==='blocked'&&blocked.faulted===1,'quota aborts guest');
 expect(c('loop_guest_error',1)===3,'quota W07 typed status');
 expect((c('mem_read32',0xC0010000)>>>0)===0xDEADBEEF,'FIRST RAM word rolled back');
 expect(c('mem_read32',0x80011000)===0 && c('mem_pages')===1,'no ghost second page');
 expect((c('loop_pc',1)>>>0)===0x80001000,'PC not committed');
 expect((c('loop_cpu_gpr',1,3)>>>0)===0x12345678,'GPR3 not committed');
 expect(c('loop_retry_quota',1)===0,'no unverified replay');
 quota.dispose();lateFaults++;
 // Second generated stw targets disallowed hardware; no W07 device callback.
 c('loop_reset');
 expect(c('mem_write32',0x80010000,0xABCDEF01)===1,'pre-existing word MMIO');
 expect(spawn(1,0x80010000,0xCC008000,0x55)===1,'bad guest destination still enters diagnostic');
 const badHost=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>callbacks++});
 const bad=await badHost.start();
 expect(bad.reason==='blocked'&&bad.faulted===1,'MMIO rejected without replay');
 expect(c('loop_guest_error',1)===7,'explicit deny (not synthetic successful hardware)');
 expect((c('mem_read32',0x80010000)>>>0)===0xABCDEF01,'original RAM untouched');
 expect(c('interop_device_invoked')===0,'no device callbacks invoked');
 badHost.dispose();deviceDenials++;
 // 128 genuine requestAnimationFrame turns against compiled generated C++.
 for(let i=0;i<128;i++){
  c('loop_reset');
  // Sparse RAM reset intentionally preserves the host page budget.
  expect(c('mem_set_page_budget',3)===1,'restore page budget after quota regression');
  expect(spawn(1,0x80010000,0x80011000,i)===1,'new public PPC fixture context');
  const one=createFrameHost(wasm,{ids:[1],budget:1,maxFrames:2,onFrame:()=>callbacks++});
  const result=await one.start();
  expect(result.reason==='completed'&&result.frames===1,'RAF fixture translation');
  expect(c('mem_read32',0xC0010000)===i,'guest primary word');
  expect(c('mem_read32',0xC0011000)===i,'guest second word');
  expect(c('loop_cpu_gpr',1,3)===i+1,'inlined helper increment');
  one.dispose();cycles++;
 }
 c('loop_reset');
 expect(c('mem_pages')===0,'no guest pages after final reset');
 const result={status:'pass',source:'public synthetic 6 PPC opcodes, actual Translator.Cli generated C++',
   actualWasm:true,contexts:3,translatedWords:2,inlinedCall:true,
   browserFrames:callbacks,stressCycles:cycles,lateRollbackVerified:lateFaults,
   deviceDeniedNoCallback:deviceDenials,finalPages:c('mem_pages'),
   warning:'test only; no original game, no arbitrary MemoryInline/store/HLE'};
 window.__nsmbTranslatedStore=result;screen.textContent=JSON.stringify(result,null,2);
}catch(e){const result={status:'fail',error:String(e?.stack||e)};
 window.__nsmbTranslatedStore=result;screen.textContent=JSON.stringify(result,null,2);}
</script></body></html>
