<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W03 — WebAssembly cooperative scheduler diagnostic</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;background:#11202b;color:#eef5fa;display:grid;place-items:center}
main{width:min(700px,90%);background:#1d3443;border:1px solid #3e6879;border-radius:16px;padding:26px}
#result{background:#243d4d;padding:16px;border-radius:8px}#result[data-status="passed"]{background:#205b43}#result[data-status="failed"]{background:#6f303a}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c202d;padding:16px;border-radius:8px}
p{color:#bad1db}
</style></head>
<body><main><h1>W03 — Browser scheduler experiment</h1>
<p>Real compiled WebAssembly with three synthetic contexts, multiple yields, suspension and resumption. Not native stackful Wii fibers and not gameplay.</p>
<div id="result" role="status" aria-live="polite" data-status="pending">Loading scheduler Wasm…</div>
<pre id="trace">Awaiting module</pre><p>No Nintendo assets, ROM, CPU registers or real guest code.</p></main>
<script type="module">
import createScheduler from './dist/scheduler.mjs';
import createAsyncify from './dist/asyncify_probe.mjs';
const result=document.getElementById('result'),log=document.getElementById('trace');
try {
 const instance=await createScheduler({locateFile:name=>'./dist/'+name});
 const c=(name,...args)=>instance['_nsmbw_sched_'+name](...args);
 const assert=(condition,message)=>{if(!condition)throw Error(message)};
 c('reset');
 for(const id of [1,2,3])assert(c('spawn',id,4)===1,'spawn '+id);
 const observed=[];
 for(let i=0;i<3;i++){observed.push(c('step'));await new Promise(done=>setTimeout(done,0));}
 assert(c('suspend',2)===1,'suspend second');
 for(let i=0;i<6;i++){observed.push(c('step'));await new Promise(done=>setTimeout(done,0));}
 assert(c('step')===-1,'blocked scheduler should return immediately');
 assert(c('resume',2)===1,'resume second');
 for(let i=0;i<3;i++){observed.push(c('step'));await new Promise(done=>setTimeout(done,0));}
 assert(c('step')===0,'all complete');
 const expected=[1,2,3,1,3,1,3,1,3,2,2,2];
 assert(JSON.stringify(observed)===JSON.stringify(expected),'deterministic interleaving');
 assert(c('done')===3,'three completed contexts');
 assert(c('trace_length')===12,'12 visible dispatches');
 assert([1,2,3].every((id)=>c('yields',id)===3),'each context yielded three times');
 const actual=Array.from({length:12},(_,i)=>c('trace_at',i)>>8);
 assert(JSON.stringify(actual)===JSON.stringify(expected),'guest trace matches output');
 assert([1,2,3].map(id=>c('value',id)).join(',')==='410,810,1210','context values preserved');
 const asyncInstance=await createAsyncify({locateFile:name=>'./dist/'+name});
 asyncInstance._nsmbw_async_reset();
 const nested=asyncInstance.ccall('nsmbw_async_nested_probe','number',['number'],[10],{async:true});
 assert(asyncInstance._nsmbw_async_phase()===1,'nested C++ reached Asyncify sleep');
 const asyncValue=await nested;
 assert(asyncValue===83 && asyncInstance._nsmbw_async_phase()===2,'Asyncify resumes preserved C++ local');
 result.dataset.status='passed';
 result.textContent='PASS — 3 contexts, 12 Wasm dispatches, Asyncify nested C++ suspend/resume';
 log.textContent='Schedule: '+observed.join(' → ')+'\nValues: 410, 810, 1210\nHost async turns: 12\nAsyncify nested C++ result: '+asyncValue;
}catch(err){
 result.dataset.status='failed';
 result.textContent='FAIL — WebAssembly scheduler test';
 log.textContent=String(err?.stack||err);
 console.error(err);
}
</script></body></html>
